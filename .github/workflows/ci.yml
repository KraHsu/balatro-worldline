name: Test and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out WorldLine
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check out the tested Steamodded JSON library
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Steamodded/smods
          ref: af0fdb1eb2c9e191262c128bc88bbc4da991e12d # 26.1002.0
          path: .deps/Steamodded
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test runtimes
        run: |
          python -m pip install --only-binary=:all: -r requirements-dev.txt
      - name: Build manual and Thunderstore packages
        id: packages
        run: python tools/build.py --target all --github-output "$GITHUB_OUTPUT"
      - name: Run Lua 5.1 and LuaJIT regression tests
        run: python tools/test.py --json-library .deps/Steamodded/libs/json/json.lua --check-packages
      - name: Upload manual-install ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: ${{ steps.packages.outputs.manual }}
          archive: false
          retention-days: 30
          if-no-files-found: error
      - name: Upload Thunderstore ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: ${{ steps.packages.outputs.thunderstore }}
          archive: false
          retention-days: 30
          if-no-files-found: error
